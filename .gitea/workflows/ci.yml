# Gitea Actions CI for the weld report (GitHub-Actions-compatible syntax).
#
# Three jobs:
#   checks     — typecheck, eslint, token-lint, SQL column read-through, vitest
#                (the DB-backed suites skip themselves when no loaded database
#                is reachable — they need sources/Weld Dump.txt, which is never
#                in git), and the mockup extractor round-trip via uv.
#   db-migrate — applies every migration to a fresh postgres:17 service and
#                checks the calendar seed; proves the SQL parses and converges.
#   build-e2e  — next build in fixture mode (PAGE_SOURCE=fixture) and the
#                Playwright layout/navigation matrix at 1280 and 360 px.
#
# NOTE: the Gitea runner on git.mantalis.qa was reported unhealthy since
# 2026-07-31 — a green badge here must be confirmed against an actual run in
# the Actions tab before anyone depends on it (see docs/ci.md).
name: ci

on:
  push:
    # main plus everyone's personal branches: <name>/dev, <name>/test, <name>/fix
    branches: [main, '*/dev', '*/test', '*/fix']
  pull_request:

env:
  NODE_VERSION: "24"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:tokens
      - name: SQL column read-through (effective schema)
        run: node --import tsx scripts/check-sql-columns.ts
      - name: vitest (DB suites skip without a loaded database)
        run: npx vitest run
        env:
          # nothing listens here in CI; the DB suites detect that and skip
          DATABASE_URL: postgres://weld:weld@127.0.0.1:5432/weld_report
      - uses: astral-sh/setup-uv@v5
      - name: mockup extractor round-trip (spec JSON must be reproducible)
        run: |
          uv run analysis/mockups/extract_welding.py
          uv run analysis/mockups/extract_flange.py
          git diff --exit-code -- analysis/mockups

  db-migrate:
    runs-on: ubuntu-latest
    services:
      # unique service name + password: on the shared runner network a service
      # called plain `postgres` resolved to a different Postgres between two
      # steps of the same job (run #2 migrated fine, run #4 failed auth on the
      # same URL) — see docs/ci.md
      weldpg:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: weld
          POSTGRES_PASSWORD: weld-ci-7d1c
          POSTGRES_DB: weld_report
        # no host port mapping: the job runs in a container on the same docker
        # network and reaches the service by its hostname; publishing 5432 on the
        # runner host collided with a Postgres already bound there (run #1)
        options: >-
          --health-cmd "pg_isready -U weld -d weld_report"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://weld:weld-ci-7d1c@weldpg:5432/weld_report
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: wait for the database service
        run: |
          for i in $(seq 1 30); do
            node --import tsx scripts/ci-db-check.ts --ping && exit 0
            sleep 2
          done
          echo "database service never became reachable" >&2; exit 1
      - name: apply every migration to an empty database
        run: npm run db:migrate
      - name: re-run is a no-op
        run: npm run db:migrate
      - name: calendar seed and schema shape
        run: node --import tsx scripts/ci-db-check.ts

  build-e2e:
    runs-on: ubuntu-latest
    env:
      PAGE_SOURCE: fixture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: layout + navigation matrix (fixture pages)
        run: npx playwright test --project=desktop-1280 --project=mobile-360
        env:
          E2E_START_SERVER: "1"
          E2E_BASE_URL: http://127.0.0.1:3000
      - uses: actions/upload-artifact@v3   # v4 needs GitHub-only APIs; Gitea supports v3
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Opens (or keeps) a pull request <branch> -> main once every check above is green.
  # Only for pushes to personal */dev and */fix branches; */test is for experiments.
  # Needs the repository secret CI_BOT_TOKEN (user ci-bot, write access); without it
  # the job logs a notice and succeeds, so CI stays green.
  auto-pr:
    name: Open PR to main
    needs: [checks, db-migrate, build-e2e]
    if: github.event_name == 'push' && (endsWith(github.ref_name, '/dev') || endsWith(github.ref_name, '/fix'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open pull request
        env:
          CI_BOT_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
          API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -z "$CI_BOT_TOKEN" ]; then
            echo "::notice::CI_BOT_TOKEN is not set - skipping automatic PR"; exit 0
          fi
          body=$(printf '{"head":"%s","base":"main","title":"%s -> main","body":"Opened automatically after CI passed on `%s` (last push by @%s). anatoly reviews and merges."}' \
            "$HEAD_REF" "$HEAD_REF" "$HEAD_REF" "$ACTOR")
          code=$(curl -sS -o /tmp/pr.json -w '%{http_code}' -X POST \
            -H "Authorization: token $CI_BOT_TOKEN" -H 'Content-Type: application/json' \
            "$API/repos/$REPO/pulls" -d "$body")
          cat /tmp/pr.json; echo
          case "$code" in
            201) echo "pull request opened" ;;
            409) echo "a pull request for $HEAD_REF is already open - it now carries this push" ;;
            422) echo "nothing to propose (branch has no changes against main)" ;;
            *) echo "::error::creating the pull request failed with HTTP $code"; exit 1 ;;
          esac
